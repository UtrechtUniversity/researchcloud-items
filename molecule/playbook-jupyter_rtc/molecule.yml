---
platforms:
  - name: workspace-src-ubuntu_jammy-nginx
    image: ghcr.io/utrechtuniversity/src-test-workspace:ubuntu_jammy-nginx
    command: /sbin/init
    pre_build_image: true
    published_ports:
      - 8080:80
    registry:
      url: $DOCKER_REGISTRY
      credentials:
        username: $DOCKER_USER
        password: $DOCKER_PW
provisioner:
  name: ansible
  env:
    components:
      - name: jupyter_rtc
        path: jupyter_rtc.yml
        parameters:
          jupyterhub_rtc_venv: /usr/local/jupyterhub
          jupyterhub_rtc_config_path: /usr/local/etc/jupyter/jupyterhub_config.py
