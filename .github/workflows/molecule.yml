name: Molecule Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# Auto-cancel any previous running jobs from the same branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_USER: ${{ github.actor }}
  DOCKER_PW: ${{ secrets.GITHUB_TOKEN }}
  DOCKER_REGISTRY: ghcr.io
  ANSIBLE_FORCE_COLOR: '1'
  ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
  MOLECULE_CONFIG: molecule/ext/molecule-src/molecule.yml
  REQUIREMENTS_FILE: molecule/ext/molecule-src/requirements.txt
  ANSIBLE_REQUIREMENTS_FILE: molecule/ext/molecule-src/requirements.yml
  CRUN_VER: 1.11.2
  VIRTUAL_ENV: ${{ github.workspace }}/.venv

jobs:

  define_changes:
    runs-on: ubuntu-latest
    outputs:
      playbook_matrix: ${{ steps.define-changes.outputs.playbook_matrix }}
      role_matrix: ${{ steps.define-changes.outputs.role_matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history to ensure proper diff resolution

      - name: Set Refs for Diff
        id: pre_diff
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF=${{ github.sha }}^1 # github creates a merge commit in pull requests. This is the first parent of the merge, which is the base. 
            HEAD_REF=${{ github.sha }} # The merge commit.
          else
            BASE_REF=${{ github.event.before }}
            HEAD_REF=${{ github.sha }}
          fi

          echo "Base SHA: $BASE_REF"
          echo "Head SHA: $HEAD_REF"

          # Set outputs for subsequent jobs
          echo "BASE_REF=$BASE_REF" >> $GITHUB_ENV
          echo "HEAD_REF=$HEAD_REF" >> $GITHUB_ENV

      - name: Get Changed Files
        id: define-changes
        run: |
          # Use git diff to detect playbook and role changes
          PLAYBOOKS=$(git diff --name-only "$BASE_REF" "$HEAD_REF" -- 'playbooks/*.yml')
          ROLES=$(git diff --name-only "$BASE_REF" "$HEAD_REF" -- 'playbooks/roles/**')

          echo "Changed playbooks: $PLAYBOOKS"
          echo "Changed roles: $ROLES"

          # Parse playbook scenarios (only for top-level files in playbooks/)
          PLAYBOOK_SCENARIOS=()
          for PLAYBOOK in $PLAYBOOKS; do
            # Ensure only valid playbook files (exclude nested paths like playbooks/roles/*)
            if [[ "$PLAYBOOK" =~ ^playbooks/[^/]+\.yml$ ]]; then
              SCENARIO_NAME=$(basename "$PLAYBOOK" .yml | sed 's/^/playbook-/')
              PLAYBOOK_SCENARIOS+=("$SCENARIO_NAME")
            fi
          done

          # Parse role scenarios (only for directories inside playbooks/roles)
          ROLE_SCENARIOS=()
          for ROLE in $ROLES; do
            # Extract top-level role path, e.g., playbooks/roles/openrefine/
            ROLE_DIR=$(echo "$ROLE" | cut -d'/' -f 1-3)
            ROLE_SCENARIOS+=("$ROLE_DIR")
          done

          # Deduplicate and convert to JSON arrays, ensure default empty arrays if no changes
          if [[ ${#PLAYBOOK_SCENARIOS[@]} -eq 0 ]]; then
            PLAYBOOK_MATRIX="[]"
          else
            PLAYBOOK_MATRIX=$(printf '%s\n' "${PLAYBOOK_SCENARIOS[@]}" | sort -u | jq -R . | jq -s -c .)
          fi

          if [[ ${#ROLE_SCENARIOS[@]} -eq 0 ]]; then
            ROLE_MATRIX="[]"
          else
            ROLE_MATRIX=$(printf '%s\n' "${ROLE_SCENARIOS[@]}" | sort -u | jq -R . | jq -s -c .)
          fi

          echo "Validated PLAYBOOK_MATRIX: $PLAYBOOK_MATRIX"
          echo "Validated ROLE_MATRIX: $ROLE_MATRIX"

          # Set outputs with escaped values
          echo "playbook_matrix=$(echo "$PLAYBOOK_MATRIX" | jq -c)" >> "$GITHUB_OUTPUT"
          echo "role_matrix=$(echo "$ROLE_MATRIX" | jq -c)" >> "$GITHUB_OUTPUT"

  playbook_tests:
    needs: define_changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        playbook: ${{ fromJSON(needs.define_changes.outputs.playbook_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up UV and caching
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv venv $VIRTUAL_ENV
          uv pip install -r ${{ env.REQUIREMENTS_FILE }}
          uv run ansible-galaxy install -r ${{ env.ANSIBLE_REQUIREMENTS_FILE }}
          uv run ansible-galaxy install -r requirements.yml

      - name: Run Molecule Tests for Playbook
        run: |
          uv run molecule -c ${{ env.MOLECULE_CONFIG }} test --scenario-name ${{ matrix.playbook }}

  role_tests:
    needs: define_changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.define_changes.outputs.role_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up UV and caching
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv venv $VIRTUAL_ENV
          uv pip install -r ${{ env.REQUIREMENTS_FILE }}
          uv run ansible-galaxy install -r ${{ env.ANSIBLE_REQUIREMENTS_FILE }}
          uv run ansible-galaxy install -r requirements.yml

      - name: Run Molecule Tests for Role
        run: |
          cd ${{ matrix.role }} && if [[ -d molecule ]]; then \
            uv run molecule -c ../../../molecule/ext/molecule-src/molecule.yml test --all; \
          fi
