name: Molecule Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# Auto-cancel any previous running jobs from the same branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_USER: ${{ github.actor }}
  DOCKER_PW: ${{ secrets.GITHUB_TOKEN }}
  DOCKER_REGISTRY: ghcr.io
  ANSIBLE_FORCE_COLOR: '0' # ANSI coloring disables GitHub's ability to mask secrets.
  ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
  MOLECULE_CONFIG: molecule/ext/molecule-src/molecule.yml
  REQUIREMENTS_FILE: molecule/ext/molecule-src/requirements.txt
  ANSIBLE_REQUIREMENTS_FILE: molecule/ext/molecule-src/requirements.yml
  VIRTUAL_ENV: ${{ github.workspace }}/.venv

jobs:

  define_changes:
    runs-on: ubuntu-latest
    outputs:
      playbook_matrix: ${{ steps.define-changes.outputs.playbook_matrix }}
      role_matrix: ${{ steps.define-changes.outputs.role_matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history to ensure proper diff resolution

      - name: Set Refs for Diff
        id: pre_diff
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF=${{ github.sha }}^1 # github creates a merge commit in pull requests. This is the first parent of the merge, which is the base. 
            HEAD_REF=${{ github.sha }} # The merge commit.
          else
            BASE_REF=${{ github.event.before }}
            HEAD_REF=${{ github.sha }}
          fi

          echo "Base SHA: $BASE_REF"
          echo "Head SHA: $HEAD_REF"

          # Set outputs for subsequent jobs
          echo "BASE_REF=$BASE_REF" >> $GITHUB_ENV
          echo "HEAD_REF=$HEAD_REF" >> $GITHUB_ENV

      - name: Get Changed Files
        id: define-changes
        run: |
          # Use git diff to detect playbook and role changes
          PLAYBOOKS=$(git diff --name-only "$BASE_REF" "$HEAD_REF" -- 'playbooks/*.yml' 'molecule/playbook-*')
          ROLES=$(git diff --name-only "$BASE_REF" "$HEAD_REF" -- 'playbooks/roles/**')

          echo "Changed playbooks: $PLAYBOOKS"
          echo "Changed roles: $ROLES"

          # Parse role scenarios (only for directories inside playbooks/roles)
          ROLE_SCENARIOS=()
          for ROLE in $ROLES; do
            # Extract top-level role path, e.g., playbooks/roles/openrefine/
            ROLE_DIR=$(echo "$ROLE" | cut -d'/' -f 1-3)
            ROLE_SCENARIOS+=("$ROLE_DIR")
          done

          # Parse playbook scenarios (only for top-level files in playbooks/)
          PLAYBOOK_SCENARIOS=()
          for PLAYBOOK in $PLAYBOOKS; do
            # Ensure only valid playbook files (exclude nested paths like playbooks/roles/*)
            # This can be a path in playbooks/*.yml or in molecule/playbook-*
            if [[ "$PLAYBOOK" =~ ^playbooks/[^/]+\.yml$ ]]; then
              SCENARIO_NAME=$(basename "$PLAYBOOK" .yml | sed 's/^/playbook-/')
            elif [[ "$PLAYBOOK" == molecule/playbook-*/* && "$PLAYBOOK" != *triggered_by_role.txt ]]; then
              # change molecule/playbook-foo/* to 'playbook-foo'
              SCENARIO_NAME="${PLAYBOOK#molecule/}"
              SCENARIO_NAME="${SCENARIO_NAME%%/*}"
            fi
            if [[ -n "$SCENARIO_NAME" ]]; then
              PLAYBOOK_SCENARIOS+=("$SCENARIO_NAME")
            fi
          done

          # each playbook scenario dir can contain a file 'triggered_by_role.txt'
          # ensure that changes to any roles mentioned in that file also trigger a playbook test
          for item in "${ROLE_SCENARIOS[@]}"; do
              # Extract role name from `playbooks/roles/<role_name>` (last path component)
              role="${item##*/}"

              # Loop through all playbook scenarios
              for scenario in molecule/playbook-*; do
                  trigger_file="$scenario/triggered_by_role.txt"

                  # Skip if file doesn't exist
                  [[ -f "$trigger_file" ]] || continue

                  # Filter comments, match whole word
                  if grep -v '^\s*#' "$trigger_file" | grep -Fxq "$role"; then
                      echo "Triggering playbook run for $scenario because role $role changed."
                      PLAYBOOK_SCENARIOS+=("${scenario##*/}")
                  fi
              done
          done

          # Filter out playbook scenarios where the underlying playbook file no longer exists
          FILTERED_PLAYBOOK_SCENARIOS=()
          for scenario in "${PLAYBOOK_SCENARIOS[@]}"; do
            playbook_name="${scenario#playbook-}"
            if [[ -f "playbooks/${playbook_name}.yml" ]]; then
              FILTERED_PLAYBOOK_SCENARIOS+=("$scenario")
            else
              echo "Skipping scenario $scenario: playbooks/${playbook_name}.yml does not exist."
            fi
          done
          PLAYBOOK_SCENARIOS=("${FILTERED_PLAYBOOK_SCENARIOS[@]}")

          # Filter out role scenarios where the underlying role directory no longer exists
          FILTERED_ROLE_SCENARIOS=()
          for item in "${ROLE_SCENARIOS[@]}"; do
            if [[ -d "$item" ]]; then
              FILTERED_ROLE_SCENARIOS+=("$item")
            else
              echo "Skipping scenario for $item: directory does not exist."
            fi
          done
          ROLE_SCENARIOS=("${FILTERED_ROLE_SCENARIOS[@]}")

          # Deduplicate and convert to JSON arrays, ensure default empty arrays if no changes
          if [[ ${#PLAYBOOK_SCENARIOS[@]} -eq 0 ]]; then
            PLAYBOOK_MATRIX="[]"
          else
            PLAYBOOK_MATRIX=$(printf '%s\n' "${PLAYBOOK_SCENARIOS[@]}" | sort -u | jq -R . | jq -s -c .)
          fi

          if [[ ${#ROLE_SCENARIOS[@]} -eq 0 ]]; then
            ROLE_MATRIX="[]"
          else
            ROLE_MATRIX=$(printf '%s\n' "${ROLE_SCENARIOS[@]}" | sort -u | jq -R . | jq -s -c .)
          fi

          echo "Validated PLAYBOOK_MATRIX: $PLAYBOOK_MATRIX"
          echo "Validated ROLE_MATRIX: $ROLE_MATRIX"

          # Set outputs with escaped values
          echo "playbook_matrix=$(echo "$PLAYBOOK_MATRIX" | jq -c)" >> "$GITHUB_OUTPUT"
          echo "role_matrix=$(echo "$ROLE_MATRIX" | jq -c)" >> "$GITHUB_OUTPUT"

  playbook_tests:
    needs: define_changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        playbook: ${{ fromJSON(needs.define_changes.outputs.playbook_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up UV and caching
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv venv $VIRTUAL_ENV
          uv pip install -r ${{ env.REQUIREMENTS_FILE }}
          uv run ansible-galaxy install -r ${{ env.ANSIBLE_REQUIREMENTS_FILE }}
          uv run ansible-galaxy install -r requirements.yml

      - name: Run Molecule Tests for Playbook
        run: |
          SCENARIO="${{ matrix.playbook }}"
          PLAYBOOK_NAME="${SCENARIO#playbook-}"
          if [[ -d molecule/${SCENARIO} ]] && [[ -f playbooks/${PLAYBOOK_NAME}.yml ]]; then
            scenario_suffix=""
            if [[ -d molecule/${SCENARIO}/default ]]; then # nested scenario
              scenario_suffix="/*"
            fi
            uv run molecule -c ${{ env.MOLECULE_CONFIG }} test --scenario-name ${SCENARIO}${scenario_suffix}
          fi

  role_tests:
    needs: define_changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.define_changes.outputs.role_matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up UV and caching
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv venv $VIRTUAL_ENV
          uv pip install -r ${{ env.REQUIREMENTS_FILE }}
          uv run ansible-galaxy install -r ${{ env.ANSIBLE_REQUIREMENTS_FILE }}
          uv run ansible-galaxy install -r requirements.yml

      - name: Run Molecule Tests for Role
        run: |
          if [[ -d ${{ matrix.role }} ]]; then # if the role directory actually exists; this will not be the case when deleting a role!
            cd ${{ matrix.role }} && if [[ -d molecule ]]; then \
              uv run molecule -c ../../../molecule/ext/molecule-src/molecule.yml test --all; \
            fi
          fi
