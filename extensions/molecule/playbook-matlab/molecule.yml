---
driver:
  name: docker
  image_settings: &image_settings
    pre_build_image: true
    registry:
      url: ${DOCKER_REGISTRY-""}
      credentials:
        username: ${DOCKER_USER-""}
        password: ${DOCKER_PW-""}
platforms:
  - name: workspace-src-ubuntu_desktop
    image: ghcr.io/utrechtuniversity/src-test-workspace:ubuntu_noble-desktop
    privileged: ${CI-false}
    capabilities:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse:rwm
    networks:
      - name: matlab_test_network
    <<: *image_settings
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - cleanup
    - destroy
