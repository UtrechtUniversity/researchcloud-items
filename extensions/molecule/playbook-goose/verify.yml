---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Test Goose
      ansible.builtin.command: goose --version
      changed_when: false

    - name: Test JupyterHub forwards Goose API key to spawned servers
      ansible.builtin.command:
        argv:
          - grep
          - -Fq
          - "'WILLMA_API_KEY': os.environ['WILLMA_API_KEY'],"
          - /usr/local/etc/jupyter/jupyterhub_config.py
      changed_when: false
