# Install Jupyter App Launcher
- name: Install jupyter_app_launcher
  notify: Restart JupyterHub
  ansible.builtin.pip:
    name: jupyter-app-launcher
    state: present
    virtualenv: "{{ _jupyterhub_app_venv }}"

# Write to config file. Like example below with blockinfile.. 
- name: Write to jupyter app launcher config
  notify: Restart JupyterHub
  ansible.builtin.blockinfile:
    path: "{{ jupyter_app_launcher_config_dir }}/jp_app_launcher_custom.yml"
    owner: root
    group: "{{ jupyterhub_app_stat.stat.gr_name }}"
    mode: "0644"
    block: "{{ [jupyter_app_launcher_config] | to_nice_yaml(indent=2, sort_keys=false) | trim }}"
    create: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK -- {{ jupyterhub_app_name }}"

- name: debug icon path
  ansible.builtin.debug:
    msg: "{{ jupyter_app_launcher_config.icon | default('not set') }}"

# Disable original launcher tiles
- name: Disable legacy server-proxy launcher tiles
  ansible.builtin.command:
    argv:
      - "{{ _jupyterhub_app_venv }}/bin/jupyter"
      - labextension
      - disable
      - --level=sys_prefix
      - "@jupyterhub/jupyter-server-proxy"
      
