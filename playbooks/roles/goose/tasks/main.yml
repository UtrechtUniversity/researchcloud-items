---
- name: Create Goose configuration directories for users
  become: true
  ansible.builtin.file:
    path: "{{ item.home }}/.config/goose/custom_providers"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.groupid | default(item.user) }}"
    mode: "0750"
  with_items: "{{ fact_regular_users }}"

- name: Install AI hub config for users
  become: true
  ansible.builtin.template:
    src: willma.json.j2
    dest: "{{ item.home }}/.config/goose/custom_providers/willma.json"
    owner: "{{ item.user }}"
    group: "{{ item.group | default(item.user) }}"
    mode: "0640"
  with_items: "{{ fact_regular_users }}"

- name: Install Goose main config for users
  become: true
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ item.home }}/.config/goose/config.yaml"
    owner: "{{ item.user }}"
    group: "{{ item.group | default(item.user) }}"
    mode: "0640"
  with_items: "{{ fact_regular_users }}"

- name: Create Goose config directory for new users
  become: true
  ansible.builtin.file:
    path: /etc/skel/.config/goose/custom_providers
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install AI hub config for new users
  become: true
  ansible.builtin.template:
    src: willma.json.j2
    dest: /etc/skel/.config/goose/custom_providers/willma.json
    owner: root
    group: root
    mode: "0644"

- name: Install Goose config for new users
  become: true
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/skel/.config/goose/config.yaml
    owner: root
    group: root
    mode: "0644"

- name: Install Goose CLI without interactive configuration
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh |
      CONFIGURE=false bash
  args:
    executable: /bin/bash
    creates: /root/.local/bin/goose

- name: Install Goose CLI system-wide
  become: true
  ansible.builtin.copy:
    src: /root/.local/bin/goose
    dest: /usr/local/bin/goose
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Install Goose desktop
  when: fact_desktop_workspace
  ansible.builtin.include_tasks: desktop.yml

- name: Create goose env dir
  become: true
  ansible.builtin.file:
    path: /etc/goose
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check whether JupyterHub configuration exists
  become: true
  ansible.builtin.stat:
    path: "{{ goose_jupyterhub_config_path }}"
  register: goose_jupyterhub_config

- name: Install Goose API key environment file
  become: true
  ansible.builtin.copy:
    dest: /etc/goose/api.env
    owner: root
    # Use the JupyterHub group when JupyterHub is present, otherwise fall back to the default ``goose_api_key_group`` (e.g., "fuse").
    group: "{{ goose_jupyterhub_config.stat.exists | ternary(jupyterhub_allowed_users_group, goose_api_key_group) }}"
    content: |
      WILLMA_API_KEY={{ WILLMA_API_KEY | quote }}
    mode: "0640"
  no_log: true
  register: goose_api_key_environment
  notify: Restart JupyterHub

- name: JupyterHub Goose integration tasks
  become: true
  when: goose_jupyterhub_config.stat.exists
  block:
    - name: Create JupyterHub systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/jupyterhub.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure JupyterHub to load Goose API key
      ansible.builtin.copy:
        dest: /etc/systemd/system/jupyterhub.service.d/goose-api-key.conf
        content: |
          [Service]
          EnvironmentFile=/etc/goose/api.env
        owner: root
        group: root
        mode: "0644"
      register: goose_jupyterhub_api_key_config
      notify: Restart JupyterHub

    - name: Add Goose API key to spawned JupyterHub server environments
      ansible.builtin.blockinfile:
        path: "{{ goose_jupyterhub_config_path }}"
        insertafter: EOF
        marker: "# {mark} ANSIBLE MANAGED BLOCK -- Goose API key"
        block: |
          import os
          c.Spawner.environment.update({
            'WILLMA_API_KEY': os.environ['WILLMA_API_KEY'],
          })
      register: goose_jupyterhub_api_key_forwarding
      notify: Restart JupyterHub

- name: Load Goose env files for login shells
  become: true
  ansible.builtin.copy:
    dest: /etc/profile.d/goose-env.sh
    content: |
      for f in /etc/goose/*.env; do
        [ -r "$f" ] && . "$f"
      done
      export WILLMA_API_KEY
    owner: root
    group: root
    mode: "0644"
