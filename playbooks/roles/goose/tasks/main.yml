---
- name: Create shared Goose config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/goose
    - /etc/goose/custom_providers

- name: Add custom provider config
  ansible.builtin.template:
    src: willma.json.j2
    dest: /etc/goose/custom_providers/willma.json
    mode: "0644"

- name: Install Goose CLI without interactive configuration
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh |
      CONFIGURE=false bash
  args:
    executable: /bin/bash
    creates: /root/.local/bin/goose

- name: Install Goose CLI system-wide
  become: true
  ansible.builtin.copy:
    src: /root/.local/bin/goose
    dest: /usr/local/bin/goose
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Download Goose desktop app .deb package
  ansible.builtin.get_url:
    url: https://github.com/aaif-goose/goose/releases/download/v1.55.0/goose_1.55.0_amd64.deb
    dest: /tmp/goose_1.55.0_amd64.deb
    owner: root
    group: root
    mode: "0644"
  when: fact_desktop_workspace | default(false)

- name: Install Goose desktop app .deb package
  become: true
  ansible.builtin.apt:
    deb: /tmp/goose_1.55.0_amd64.deb
  when: fact_desktop_workspace | default(false)

- name: Set Goose config directory for login shells
  ansible.builtin.copy:
    dest: /etc/profile.d/goose.sh
    content: |
      export GOOSE_CONFIG_DIR=/etc/goose
    owner: root
    group: root
    mode: "0644"

- name: Install Goose API key environment file
  become: true
  ansible.builtin.copy:
    dest: /etc/goose/api.env
    owner: root
    group: "{{ jupyterhub_allowed_users_group }}"
    content: |
      export WILLMA_API_KEY={{ WILLMA_API_KEY | quote }}
    mode: "0640"

- name: Load Goose API key for login shells
  become: true
  ansible.builtin.copy:
    dest: /etc/profile.d/goose-api.sh
    content: |
      if [ -r /etc/goose/api.env ]; then
        . /etc/goose/api.env
      fi
    owner: root
    group: root
    mode: "0644"
