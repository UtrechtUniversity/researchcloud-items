---
- name: Read file from managed host
  ansible.builtin.slurp:
    src: /etc/nginx/app-location-conf.d/{{ item }}
  register: remote_file

- name: Assert host file matches controller file (whitespace-normalized)
  vars:
    remote_content: >-
      {{ (remote_file.content | b64decode)
         | regex_replace('\r\n', '\n')
         | regex_replace('[ \t]+', ' ')
         | regex_replace('\n[ \t]*\n+', '\n')
         | trim }}
    local_content: >-
      {{ lookup('file', 'files/{{ item }}')
         | regex_replace('\r\n', '\n')
         | regex_replace('[ \t]+', ' ')
         | regex_replace('\n[ \t]*\n+', '\n')
         | trim }}
  ansible.builtin.assert:
    that:
      - remote_content == local_content
    fail_msg: "File content differs between host and controller (after whitespace normalization)"
    success_msg: "File content matches"
