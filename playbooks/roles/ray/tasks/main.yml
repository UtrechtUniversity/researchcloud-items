---
- name: Set Ray temp dir
  when: ansible_facts["mounts"] | selectattr('mount', 'eq', '/mnt/scratch') | list | length > 0
  ansible.builtin.set_fact:
    ray_tmp_dir: /mnt/scratch

- name: Install recommended driver (server/headless flavour)
  ansible.builtin.command: ubuntu-drivers install --gpgpu
  when:
    - ansible_os_family == "Debian"
    - fact_workspace_has_gpu

- name: User provisioning
  block:
    - name: Create user {{ ray_user }}
      ansible.builtin.user:
        name: "{{ ray_user }}"
        state: present
        shell: /bin/bash
        generate_ssh_key: "{{ ray_head_node }}" # In autoscale mode, we want to have an existing keypair for the head node to use to login to new nodes. If not in autoscale mode, these keys will be ignored.
        ssh_key_comment: ""
      register: ray_created_user

    - name: Setup ssh key
      when: (ray_public_key | length) > 0
      ansible.posix.authorized_key:
        user: "{{ ray_user }}"
        state: present
        key: "{{ ray_public_key }}"

    # The Ray SRC provider expects the public key to be at a pre-determined location
    # This is to propagate the key to new nodes.
    - name: Write ssh key to expected location
      when: (ray_public_key | length) > 0
      ansible.builtin.copy:
        dest: "/home/{{ ray_user }}/ray_public.pub"
        owner: "{{ ray_user }}"
        group: "{{ ray_user }}"
        mode: "0600"
        content: "{{ ray_public_key }}"

    - name: Add token to .bashrc
      when: (ray_src_token | length) > 0
      ansible.builtin.lineinfile:
        path: "/home/{{ ray_user }}/.bashrc"
        line: export RESEARCH_CLOUD_TOKEN="{{ ray_src_token }}"
        owner: "{{ ray_user }}"
        group: "{{ ray_user }}"
        mode: "0600"

    - name: Allow user to control systemd service for {{ ray_user }}
      when: ray_setup
      tags: molecule-idempotence-notest
      community.general.sudoers:
        name: ray-systemctl
        state: present
        user: "{{ ray_user }}"
        nopassword: true
        commands:
          - /usr/bin/systemctl start {{ ray_service_name }}.service
          - /usr/bin/systemctl restart {{ ray_service_name }}.service
          - /usr/bin/systemctl status {{ ray_service_name }}.service
          - /usr/bin/systemctl stop {{ ray_service_name }}.service

- name: Find private network
  block:
    - name: Create find_ip script
      ansible.builtin.copy:
        src: find_private_ip.sh
        dest: /usr/local/bin/find_private_ip.sh
        owner: root
        group: root
        mode: "0655"

    - name: Test find private ip
      ansible.builtin.command:
        cmd: /usr/local/bin/find_private_ip.sh
      register: find_private_ip
      changed_when: false

    - name: Fail if no private network
      when:
        - find_private_ip.rc != 0
      ansible.builtin.fail:
        msg: "No private network found! Result of script: {{ find_private_ip.stdout }}"

    - name: Set internal ip
      ansible.builtin.set_fact:
        ray_internal_ip: "{{ find_private_ip.stdout | trim }}"

    - name: Set auth token
      when: (ray_auth_token | length) > 0
      ansible.builtin.copy:
        dest: "/home/{{ ray_user }}/auth_token"
        owner: "{{ ray_user }}"
        group: "{{ ray_user }}"
        mode: "0600"
        content: "{{ ray_auth_token }}"

    - name: Set connect address
      ansible.builtin.set_fact:
        ray_connect_address: |-
          {%- if ray_head_node_address | length > 0 -%}
          {%- if ':' in ray_head_node_address -%}
          {{ ray_head_node_address }}
          {%- else -%}
          {{ ray_head_node_address }}:{{ ray_head_node_port }}
          {%- endif -%}
          {%- elif ray_head_node -%}
          {{ ray_internal_ip }}:{{ ray_head_node_port }}
          {%- else -%}
          auto
          {%- endif -%}

- name: Setup venv
  block:
    - name: Create venv
      ansible.builtin.command:
        cmd: |-
          uv venv
          {% if (ray_python_version | length) > 0 %}
          --python {{ ray_python_version }}
          {% else %}
          --no-managed-python
          {% endif %}
          --seed
          {{ ray_venv }}
        creates: "{{ ray_venv }}"
      environment:
        UV_PYTHON_INSTALL_DIR: /opt/

    - name: Install ray
      ansible.builtin.command:
        cmd: uv pip install ray{{ ray_final_extras }}{{ ray_version }} {{ ray_final_packages }}
        creates: "{{ ray_venv }}/bin/ray"
      environment:
        VIRTUAL_ENV: "{{ ray_venv }}"

    - name: Add venv to .bashrc PATH
      ansible.builtin.lineinfile:
        path: "/home/{{ ray_user }}/.bashrc"
        line: 'export PATH="{{ ray_venv }}/bin/:$PATH"'
        state: present

# When Ray is not being run as a systemd service, configure global ulimits for the ray user.
# Systemd already handles this for us.
- name: Configure global ulimits for the ray user
  when: not ray_setup
  block:
    - name: Set pam limits for ray user
      community.general.pam_limits:
        domain: "{{ ray_user }}"
        limit_type: "{{ item.type }}"
        limit_item: "{{ item.item }}"
        value: 1048576
      loop:
        - { type: 'soft', item: 'nproc' }
        - { type: 'hard', item: 'nproc' }
        - { type: 'soft', item: 'nofile' }
        - { type: 'hard', item: 'nofile' }

    - name: Ensure PAM limits are loaded for non-interactive sessions
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-session-noninteractive
        line: "session required pam_limits.so"
        state: present

- name: Create Ray env file
  ansible.builtin.template:
    src: ray.env.j2
    dest: "/home/{{ ray_user }}/{{ ray_service_name }}.env"
    owner: "{{ ray_user }}"
    group: "{{ ray_user }}"
    mode: "0600"

- name: Create autoscaling config
  when:
    - ray_head_node
    - ray_autoscale
  ansible.builtin.include_tasks:
    file: create_autoscale_config.yml

- name: Create Ray systemd service
  when: ray_setup
  ansible.builtin.template:
    src: ray.service.j2
    dest: /etc/systemd/system/{{ ray_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart ray systemd service
    - Fail if ray is not active

- name: Enable logrotation for service
  when: ray_setup
  ansible.builtin.blockinfile:
    path: /etc/logrotate.d/{{ ray_service_name }}
    block: >
      /var/log/{{ ray_service_name }}.log {
        hourly
        rotate 5
        size 50M
        compress
        delaycompress
        missingok
        copytruncate
      }
    create: true
    mode: "0644"
