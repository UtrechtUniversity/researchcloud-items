---
- name: Get CO info
  tags: molecule-notest
  when: not (ray_src_co_name | length) > 0 or not (ray_src_wallet_name | length) > 0 or not (ray_src_cloud_name | length) > 0
  block:

    - name: Get CO info shell
      ansible.builtin.shell:
        cmd: "source /home/{{ ray_user }}/.bashrc && {{ ray_venv }}/bin/researchcloud get-current-workspace"
      args:
        executable: /bin/bash
      register: co_info
      changed_when: false
      failed_when: ray_fail_hard and co_info.rc > 0

    - name: Parse CO information
      when: co_info.rc == 0
      ansible.builtin.set_fact:
        co_info_json: "{{ co_info.stdout | from_json }}"

    - name: Set wallet, CO, and cloud names
      when: co_info.rc == 0
      ansible.builtin.set_fact:
        ray_src_wallet_name: "{{ ray_src_wallet_name | default(co_info_json.meta.wallet_name, true) }}"
        ray_src_co_name: "{{ ray_src_co_name | default(co_info_json.meta.co_name, true) }}"
        ray_src_cloud_name: "{{ ray_src_cloud_name | default(co_info_json.meta.subscription_name, true) }}"

- name: Create autoscaling config file
  ansible.builtin.template:
    src: "{{ ray_autoscale_config }}"
    dest: "/home/{{ ray_user }}/ray_bootstrap_config.yaml"
    owner: "{{ ray_user }}"
    group: "{{ ray_user }}"
    mode: "0600"

  # The ResearchCloud Ray provider's bootstrap_config function dynamically loads
  # available node types from the Catalog Item flavours. So we must run the provided
  # base config through the bootstrap process to ensure node types matching live flavours
  # are available.
- name: Run autoscaling config through Ray bootstrap process
  block:
    - name: Place bootstrap script
      ansible.builtin.template:
        src: templates/bootstrap_config.py.j2
        dest: /home/{{ ray_user }}/bootstrap_config.py
        owner: "{{ ray_user }}"
        group: "{{ ray_user }}"
        mode: "0600"

      # This requires hitting the ResearchCloud API -- so don't test this in molecule.
    - name: Run bootstrap script
      tags: molecule-notest
      ansible.builtin.shell:
        cmd: source /home/{{ ray_user }}/.bashrc && {{ ray_venv }}/bin/python /home/{{ ray_user }}/bootstrap_config.py
      register: run_bootstrap_script
      failed_when: ray_fail_hard and run_bootstrap_script.rc > 0
      args:
        executable: /bin/bash
