---
# noqa: jinja[spacing]
ray_final_extras: >-
  {%- if (ray_user_extras | length) > 0 -%}
  [{{ ray_user_extras }}]
  {%- elif ray_head_node -%}
  [default,client]
  {%- else -%}
  [default]
  {%- endif -%}
# noqa: jinja[spacing]
ray_service_name: >-
  ray_
  {%- if (ray_service_prefix | length) > 0 -%}
  {{ ray_service_prefix }}_
  {%- endif -%}
  {{ ray_head_node | ternary('head', 'worker') }}
ray_cmd: "{{ ray_venv }}/bin/ray"
# noqa: jinja[spacing]
ray_final_packages: >-
  {{ ray_head_node | ternary('git+https://github.com/UtrechtUniversity/src-ray-provider.git ', '') }}
  {%- if (ray_user_packages | length) > 0 -%}
  {{ ray_user_packages | join(' ') }}
  {%- endif -%}
