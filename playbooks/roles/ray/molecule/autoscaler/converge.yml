---
- name: Converge
  hosts: all
  gather_facts: true
  roles:
    - role: ray
      vars:
        ray_head_node: true
        ray_head_no_cpu: true
        ray_dashboard_host: "0.0.0.0" # bind the dashboard to localhost for debugging
        ray_fail_hard: true
        ray_auth_token: "foo"
        ray_autoscale: true
        ray_autoscale_config: "../files/fake_multi_node.yaml"
        ray_env: "RAY_FAKE_CLUSTER=1" # needed to test fake autoscaler
