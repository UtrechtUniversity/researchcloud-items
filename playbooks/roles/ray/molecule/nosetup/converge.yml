---
- name: Converge
  hosts: all
  gather_facts: true
  roles:
    - role: ray
      vars:
        ray_head_node: true
        ray_dashboard_host: "0.0.0.0" # bind the dashboard to localhost for debugging
        ray_fail_hard: false
        ray_setup: false
    - role: ray
      vars:
        ray_head_node: false
        ray_fail_hard: false
        ray_setup: false

  tasks:
    # normally the role handlers should start services using handlers
    # however, since we are including the same role twice (for ray_worker and ray_head),
    # handlers don't work well -- both services should be reloaded and restarted, but the handler only restarts the last one.
    # so we explictly start both service here.
    # in production, shouldn't run a head node and worker node on the same host.
    - name: Start ray
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      with_items:
        - ray_head
        - ray_worker
