---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Test login
      ansible.builtin.uri:
        url: http://localhost:80
        method: GET
        headers:
          user: testuser
        return_content: true
      failed_when: false
      register: jupyterhub_login

    - name: Test login with not allowed user
      ansible.builtin.uri:
        url: http://localhost:80
        method: GET
        headers:
          user: root
      failed_when: false
      register: jupyterhub_login_not_allowed

    - name: Test login with not existing user
      ansible.builtin.uri:
        url: http://localhost:80
        method: GET
        headers:
          user: foo
      failed_when: false
      register: jupyterhub_login_not_exist

    - name: Debug 1
      ansible.builtin.debug:
        var: jupyterhub_login

    - name: Debug 2
      ansible.builtin.debug:
        var: jupyterhub_login_not_allowed

    - name: Debug 3
      ansible.builtin.debug:
        var: jupyterhub_login_not_exist

    - name: Assert failed logins
      ansible.builtin.assert:
        that:
          - jupyterhub_login.status == 200
          - jupyterhub_login_not_allowed.status == 500
          - jupyterhub_login_not_exist.status == 500

    - name: Fail if any venv file is group-writeable
      ansible.builtin.command: >
        find /usr/local/jupyterhub -type f -perm -g+w -print
      register: venv_gw_files
      changed_when: false
      failed_when: venv_gw_files.stdout != ""

    - name: Ensure normal users cannot read the CHP and Hub sockets
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0660"
        owner: "jupyter"
        group: "nginx"
      register: check_permissions
      check_mode: true
      failed_when: check_permissions.changed
      with_items:
        - /var/www/jupyterhub_run/jupyterhub.sock
        - /var/www/jupyterhub_run/chp.sock
        - /var/www/jupyterhub_run/chp-api.sock

    - name: Test public API socket 1
      ansible.builtin.uri:
        url: http://localhost/hub/api/users/testuser/activity
        unix_socket: /var/www/jupyterhub_public_run/jupyterhub-api.sock
        method: POST
        return_content: true
      register: public_api_read
      failed_when: public_api_read.status != 403

    - name: Test public API socket 2
      ansible.builtin.uri:
        url: http://localhost/hub/api/ # returns version, not authenticated
        unix_socket: /var/www/jupyterhub_public_run/jupyterhub-api.sock
        method: GET
        return_content: true
      register: public_api_read
      failed_when: public_api_read.status != 200
