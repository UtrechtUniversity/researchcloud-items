---
jupyterhub_user: jupyter
jupyterhub_user_home: /var/www/jupyter
jupyterhub_venv: "/usr/local/jupyterhub"
jupyterhub_sudospawner_path: "{{ jupyterhub_venv }}/bin/sudospawner"
jupyterhub_uri_with_slashes: "{{ '/' ~ (jupyterhub_uri | trim('/')) ~ '/' if jupyterhub_uri != '/' else '/' }}"
jupyterhub_proxy_bind_addr: |
  {% if jupyterhub_enable_unix_socket %}
  http://unix:{{ jupyterhub_rundir }}/chp.sock
  {% else %}
  http://{{ jupyterhub_bind_addr }}:{{ jupyterhub_port }}
  {% endif %}
jupyterhub_default_proxy_config:
  name: jupyterhub
  location: "{{ jupyterhub_uri_with_slashes }}"
  proxy_pass: "{{ jupyterhub_proxy_bind_addr }}"
  proxy_redirect: http://{{ jupyterhub_bind_addr }}:{{ jupyterhub_port }} $scheme://$host{{ jupyterhub_uri }}
  auth: "{{ jupyterhub_auth }}"
  htpasswd: "{{ (jupyterhub_auth == 'basic') | ternary('jupyterhub', omit) }}"
  auth_sram_header: "{{ jupyterhub_remote_user_header }}"
jupyterhub_system_pip: "{{ (jupyterhub_venv | default('system', true)) == 'system' }}"
jupyterhub_rundir: /var/run/jupyterhub
jupyterhub_public_rundir: /var/run/jupyterhub_public
jupyterhub_api_uri: "{{ jupyterhub_uri_with_slashes }}hub/api"
