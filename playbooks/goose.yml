---
- name: Install Goose
  hosts: all
  gather_facts: true
  roles:
    - role: jupyter-ai
    - role: vllm
      vars:
        vllm_enabled: >-
          {{
            not (
              goose_use_willma | default(true) | bool and
              (WILLMA_API_KEY | default('mock-key')) != 'mock-key'
            )
          }}
        vllm_model: "{{ goose_vllm_model | default('Qwen/Qwen2.5-1.5B-Instruct') }}"
    - role: goose
      vars:
        jupyterhub_allowed_users_group: jupyterhub
