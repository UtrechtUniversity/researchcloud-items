---
- name: Install a Ray head node or worker
  hosts: all
  gather_facts: false
  roles:
    - role: ray
      vars: # all these parameters must be defined in the component
        ray_head_node: "{{ head_node | default(false, true) | bool }}"
        ray_head_no_cpu: "{{ head_no_cpu | default(true, true) | bool }}"
        ray_head_node_address: "{{ head_node_address | default('', true) }}"
        ray_dashboard_port: "{{ dashboard_port | default('8265', true) }}"
        ray_client_server_port: "{{ rclient_server_port | default('10001', true) }}"
        ray_head_node_port: "{{ head_node_port | default('6379', true) }}"
        ray_env: "{{ env | default('') }}"
        ray_src_token: "{{ src_token | default('') }}"
        ray_auth_token: "{{ auth_token | default('') }}"
        ray_public_key: "{{ public_key | default('') }}"
        ray_fail_hard: "{{ fail_hard | default(false, true) | bool }}"
        ray_user_packages: "{{ packages | default('') }}"
        ray_python_version: "{{ python_version | default('', true) }}"
        ray_version: "{{ version | default('', true) | length | ternary('=='~version, '') }}"
        ray_setup: "{{ do_setup | default(true, true) | bool }}"
        ray_autoscale: "{{ autoscale | default(false, true) | bool }}"
        ray_src_wallet_name: "{{ src_wallet_name | default('') }}"
        ray_src_co_name: "{{ src_co_name | default('') }}"
        ray_src_cloud_name: "{{ src_cloud_name | default('SURF HPC Cloud', true) }}"
        ray_src_max_workers: "{{ src_max_workers | default('6', true) }}"
